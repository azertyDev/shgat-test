server {
  listen 80;
  root /usr/share/nginx/html;

  # Docker's DNS; resolving per request lets nginx start (and answer 502) while the API is down
  resolver 127.0.0.11 valid=10s ipv6=off;

  # same origin for the browser: /api goes to the NestJS container
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 3 files, the API itself rejects anything above 50 MB per file
    client_max_body_size 160m;
    proxy_request_buffering off;
    proxy_read_timeout 60s;
  }

  # hashed build assets never change
  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # client-side routes (/applications/5, ...) are served by index.html
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
